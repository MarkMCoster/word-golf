║   rules_version = '2';
service cloud.firestore {
  match /databases/{db}/documents {

    // Users collection
    match /users/{uid} {
      // Any signed-in user can read another user's document (needed for name lookup)
      // In practice only displayName is used from other users' docs
      allow read: if request.auth != null;
      // Only the owner can write their own doc — EXCEPT:
      // A friend acceptance is allowed to add the acceptor's uid to the
      // acceptee's friends array (and only that field, one item at a time)
      allow write: if request.auth.uid == uid;
      allow update: if request.auth != null
        && request.resource.data.diff(resource.data)
             .affectedKeys().hasOnly(['friends'])
        && request.resource.data.friends.hasAll(resource.data.friends)
        && request.resource.data.friends.size()
             == resource.data.friends.size() + 1;
    }

    // Friend requests collection
    match /friendRequests/{reqId} {
      // Only sender or recipient can read a request
      allow read: if request.auth != null
        && (request.auth.uid == resource.data.from
        ||  request.auth.uid == resource.data.to);
      // Only the sender can create (from must equal their uid)
      allow create: if request.auth != null
        && request.auth.uid == request.resource.data.from;
      // Only the recipient can update status (accept / decline)
      allow update: if request.auth != null
        && request.auth.uid == resource.data.to;
    }

    // Matches
    match /matches/{mid} {
      allow read, write: if request.auth != null
        && (resource == null
        ||  request.auth.uid == resource.data.player1
        ||  request.auth.uid == resource.data.player2);
    }
  }
}

// ─── AUTH ACTIONS ─────────────────────────────────────────
function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t,i) => t.classList.toggle('active', i===(tab==='login'?0:1)));
  document.getElementById('auth-login').classList.toggle('active', tab==='login');
  document.getElementById('auth-register').classList.toggle('active', tab==='register');
}
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  const err   = document.getElementById('login-error'); err.style.display = 'none';
  if (!email || !pass) { err.textContent = 'Please enter your email and password.'; err.style.display = 'block'; return; }
  try { await auth.signInWithEmailAndPassword(email, pass); }
  catch(e) {
    console.error('Login error:', e.code, e.message);
    err.textContent = friendlyAuthError(e.code);
    err.style.display = 'block';
  }
}
async function doRegister() {
  const name  = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass  = document.getElementById('reg-password').value;
  const err   = document.getElementById('reg-error'); err.style.display = 'none';
  if (!name)  { err.textContent = 'Display name is required.'; err.style.display = 'block'; return; }
  if (!email) { err.textContent = 'Email is required.'; err.style.display = 'block'; return; }
  if (pass.length < 6) { err.textContent = 'Password must be at least 6 characters.'; err.style.display = 'block'; return; }
  try {
    // Create the Firebase Auth account
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    // Set display name on auth profile
    await cred.user.updateProfile({ displayName: name });
    // Pre-populate currentUserDoc so onAuthStateChanged skips the Firestore create
    // (ensureUserDoc checks snap.exists, but the write below races with it — 
    //  setting currentUserDoc here ensures the race is harmless)
    currentUserDoc = { displayName: name, email, friends: [] };
    // Write user document — wrapped separately so auth errors vs Firestore errors are distinct
    try {
      await db.collection('users').doc(cred.user.uid).set(currentUserDoc);
    } catch(fsErr) {
      // Firestore write failed — most likely rules not set up yet.
      // Auth account was created successfully, so onAuthStateChanged will still fire.
      // ensureUserDoc() in the state handler will retry the write.
      console.warn('Firestore user doc write failed (will retry on login):', fsErr.message);
    }
    // onAuthStateChanged fires automatically — no need to call navTo here
  } catch(e) {
    console.error('Registration error:', e.code, e.message);
    err.textContent = friendlyAuthError(e.code);
    err.style.display = 'block';
  }
}
async function doForgotPassword() {
  const email = document.getElementById('login-email').value.trim();
  if (!email) { toast('Enter your email first'); return; }
  try { await auth.sendPasswordResetEmail(email); toast('Reset email sent!'); }
  catch(e) { toast('Could not send reset email'); }
}
function doLogout() { if (!confirm('Sign out?')) return; auth.signOut(); }
function friendlyAuthError(code) {
  const map = {
    'auth/invalid-email':          'Invalid email address.',
    'auth/user-not-found':         'No account found with that email.',
    'auth/wrong-password':         'Incorrect password.',
    'auth/email-already-in-use':   'That email is already registered.',
    'auth/weak-password':          'Password must be at least 6 characters.',
    'auth/invalid-credential':     'Invalid email or password.',
    'auth/too-many-requests':      'Too many attempts — please wait a moment.',
    'auth/network-request-failed': 'Network error — check your connection.',
    'auth/operation-not-allowed':  'Email/password sign-in is not enabled. Check your Firebase Console → Authentication → Sign-in method.',
    'auth/configuration-not-found':'Firebase is not configured. Paste your firebaseConfig credentials into the JS block at the top of this file.',
    'auth/api-key-not-valid':      'Firebase API key is invalid. Paste your firebaseConfig credentials into the JS block.',
  };
  return map[code] || (code ? `Error: ${code}` : 'Something went wrong. Please try again.');
}

// Override existing showScreen and goHome
const _origShowScreen = showScreen;
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
function navTo(tab) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('nav-' + tab).classList.add('active');
  if (tab === 'play') { showScreen('home-screen'); initHome(); }
  else if (tab === 'matches') { showScreen('matches-screen'); }
  else if (tab === 'friends') { showScreen('friends-screen'); refreshFriendsScreen(); }
}
function goHome() { navTo('play'); }

// ─── FRIENDS ──────────────────────────────────────────────
async function updateFriendRequestBadge() {
  if (!currentUser) return;
  try {
    const snap = await db.collection('friendRequests')
      .where('to', '==', currentUser.uid)
      .where('status', '==', 'pending')
      .get();
    const b = document.getElementById('friends-badge');
    if (!snap.empty) { b.textContent = snap.size; b.style.display = 'block'; }
    else b.style.display = 'none';
  } catch(e) {}
}
async function searchFriends() {
  const q = document.getElementById('friend-search-input').value.trim();
  if (!q) { toast('Enter a name to search'); return; }
  const res = document.getElementById('friend-search-results');
  res.innerHTML = '<div style="color:var(--gray-mid);font-size:12px;padding:8px 0">Searching…</div>';
  try {
    const snap = await db.collection('users').where('displayName','>=',q).where('displayName','<=',q+'').limit(10).get();
    if (snap.empty) { res.innerHTML = '<div style="color:var(--gray-mid);font-size:12px;padding:8px 0">No players found.</div>'; return; }
    res.innerHTML = '';
    snap.forEach(doc => {
      if (doc.id === currentUser.uid) return;
      const data = doc.data();
      const isFriend = (currentUserDoc?.friends || []).includes(doc.id);
      const requested = (data.friendRequests || []).includes(currentUser.uid);
      const card = document.createElement('div'); card.className = 'search-result-card';
      card.innerHTML = `<div class="friend-avatar">${(data.displayName||'?')[0].toUpperCase()}</div>
        <div class="friend-name" style="flex:1">${data.displayName}</div>
        ${isFriend ? '<span style="color:var(--green-light);font-size:12px;font-family:monospace">Friends ✓</span>'
          : requested ? '<span style="color:var(--gray-mid);font-size:12px;font-family:monospace">Requested</span>'
          : `<button class="btn btn-sm" onclick="sendFriendRequest('${doc.id}','${data.displayName}')">Add</button>`}`;
      res.appendChild(card);
    });
  } catch(e) { res.innerHTML = '<div style="color:#e06060;font-size:12px;padding:8px 0">Search failed.</div>'; }
}
async function sendFriendRequest(toUid, toName) {
  try {
    // Check for existing pending request
    const existing = await db.collection('friendRequests')
      .where('from', '==', currentUser.uid)
      .where('to', '==', toUid)
      .where('status', '==', 'pending')
      .limit(1).get();
    if (!existing.empty) { toast('Request already sent'); return; }
    // Write request doc — sender only writes docs where from == their own uid
    await db.collection('friendRequests').add({
      from: currentUser.uid,
      fromName: currentUserDoc?.displayName || currentUser.email,
      to: toUid,
      status: 'pending',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    toast(`Friend request sent to ${toName}! 🤝`);
    document.getElementById('friend-search-results').innerHTML = '';
    document.getElementById('friend-search-input').value = '';
  } catch(e) {
    console.error('sendFriendRequest error:', e);
    toast('Could not send request — check Firestore rules');
  }
}
async function acceptFriendRequest(fromUid, requestId) {
  try {
    // 1. Mark the request doc as accepted
    await db.collection('friendRequests').doc(requestId).update({ status: 'accepted' });
    // 2. Add the sender to OUR friends list (we own our doc)
    await db.collection('users').doc(currentUser.uid).update({
      friends: firebase.firestore.FieldValue.arrayUnion(fromUid)
    });
    // 3. Add US to the SENDER's friends list.
    //    The Firestore rule allows this when the acceptedBy field matches our uid.
    await db.collection('users').doc(fromUid).update({
      friends: firebase.firestore.FieldValue.arrayUnion(currentUser.uid)
    });
    toast('Friend added! 🤝');
    refreshFriendsScreen();
  } catch(e) {
    console.error('acceptFriendRequest error:', e);
    toast('Could not accept — check Firestore rules are updated');
  }
}
async function declineFriendRequest(fromUid, requestId) {
  try {
    await db.collection('friendRequests').doc(requestId).update({ status: 'declined' });
    refreshFriendsScreen();
  } catch(e) { toast('Could not decline request'); }
}
async function refreshFriendsScreen() {
  if (!currentUser) return;

  // ── Incoming pending friend requests ──────────────────────────────────
  const reqSec  = document.getElementById('friend-requests-section');
  const reqList = document.getElementById('friend-requests-list');
  try {
    const reqSnap = await db.collection('friendRequests')
      .where('to', '==', currentUser.uid)
      .where('status', '==', 'pending')
      .get();
    if (!reqSnap.empty) {
      reqSec.style.display = 'block'; reqList.innerHTML = '';
      reqSnap.forEach(doc => {
        const data = doc.data();
        const name = data.fromName || data.from;
        const card = document.createElement('div'); card.className = 'request-card';
        card.innerHTML = `<div class="friend-avatar">${(name[0]||'?').toUpperCase()}</div>
          <div class="request-name">${name}</div>
          <div style="display:flex;gap:7px">
            <button class="btn btn-sm" onclick="acceptFriendRequest('${data.from}','${doc.id}')">Accept</button>
            <button class="btn btn-secondary btn-sm" onclick="declineFriendRequest('${data.from}','${doc.id}')">Decline</button>
          </div>`;
        reqList.appendChild(card);
      });
      // Update badge
      const badge = document.getElementById('friends-badge');
      badge.textContent = reqSnap.size; badge.style.display = 'block';
    } else {
      reqSec.style.display = 'none';
      document.getElementById('friends-badge').style.display = 'none';
    }
  } catch(e) { console.error('Loading friend requests failed:', e); }

  // ── Friends list ───────────────────────────────────────────────────────
  const fl = document.getElementById('friends-list');
  // Re-fetch our own doc to get latest friends array
  try {
    const mySnap = await db.collection('users').doc(currentUser.uid).get();
    if (mySnap.exists) currentUserDoc = mySnap.data();
  } catch(e) {}

  const friends = currentUserDoc?.friends || [];
  if (!friends.length) {
    fl.innerHTML = '<div class="empty-state" style="padding:14px 0"><span class="empty-state-icon">🤝</span><div class="empty-state-text">No friends yet</div><div class="empty-state-sub">Search above to add players</div></div>';
    return;
  }
  fl.innerHTML = '';
  for (const uid of friends) {
    try {
      // Only fetch displayName — do not expose private fields
      const snap = await db.collection('users').doc(uid).get();
      const name = snap.exists ? (snap.data().displayName || uid) : uid;
      const card = document.createElement('div'); card.className = 'friend-card';
      card.innerHTML = `<div class="friend-avatar">${(name[0]||'?').toUpperCase()}</div>
        <div class="friend-name">${name}</div>
        <button class="btn btn-sm" onclick="openNewMatchModalWith('${uid}','${name}')">⛳ Match</button>`;
      fl.appendChild(card);
    } catch(e) {}
  }
}

// ─── MATCHES ──────────────────────────────────────────────
let activeMatchId=null, activeMatchData=null, activeMatchOpponentName='Opponent', opponentUid=null;

async function renderMatchesList(matches) {
  const container = document.getElementById('matches-list');
  matches.sort((a,b) => (a.status==='active'?0:1) - (b.status==='active'?0:1));
  const activeCount = matches.filter(m => m.status==='active').length;
  const badge = document.getElementById('matches-badge');
  if (activeCount > 0) { badge.textContent = activeCount; badge.style.display = 'block'; } else badge.style.display = 'none';
  if (!matches.length) { container.innerHTML = '<div class="empty-state"><span class="empty-state-icon">⚔️</span><div class="empty-state-text">No matches yet</div><div class="empty-state-sub">Tap "+ New Match" to challenge a friend</div></div>'; return; }
  container.innerHTML = '';
  for (const match of matches) {
    const isP1 = match.player1 === currentUser.uid;
    const oppU = isP1 ? match.player2 : match.player1;
    const myS  = (match.scores && match.scores[currentUser.uid]) || [];
    const oppS = (match.scores && match.scores[oppU]) || [];
    const myVP  = myS.filter(s=>s!=null).reduce((a,s)=>a+scoreInfo(s).vspar, 0);
    const oppVP = oppS.filter(s=>s!=null).reduce((a,s)=>a+scoreInfo(s).vspar, 0);
    const myH   = myS.filter(s=>s!=null).length;
    const oppH  = oppS.filter(s=>s!=null).length;
    const course = COURSES.find(c=>c.id===match.courseId) || {name: match.courseId};
    let oppName = 'Opponent';
    try { const snap = await db.collection('users').doc(oppU).get(); if (snap.exists) oppName = snap.data().displayName; } catch(e) {}
    const card = document.createElement('div'); card.className = 'match-card';
    card.innerHTML = `
      <div class="match-card-header">
        <div class="match-course-nm">${course.name}</div>
        <div class="match-status-badge ${match.status}">${match.status==='active'?'Active':'Complete'}</div>
      </div>
      <div class="match-players">
        <div class="match-player is-you">
          <div class="match-player-name">You</div>
          <div class="match-player-score" style="color:${myVP<0?'var(--gold)':myVP===0?'var(--green-light)':'#e06060'}">${fmtVP(myVP)}</div>
          <div class="match-player-holes">${myH}/18 holes</div>
        </div>
        <div style="display:flex;align-items:center;font-family:'Playfair Display',serif;color:var(--gray-mid);font-size:16px;padding:0 4px">vs</div>
        <div class="match-player">
          <div class="match-player-name">${oppName}</div>
          <div class="match-player-score" style="color:${oppVP<0?'var(--gold)':oppVP===0?'var(--green-light)':'#e06060'}">${fmtVP(oppVP)}</div>
          <div class="match-player-holes">${oppH}/18 holes</div>
        </div>
      </div>
      ${match.status==='complete' ? `<div class="winner-banner"><div class="winner-title">${match.winner===currentUser.uid?'🏆 You win!':(match.winner==='tie'?'🤝 Tie game!':'💀 '+oppName+' wins')}</div></div>` : ''}`;
    if (match.status === 'active') card.onclick = () => openMatchGame(match.id, match, oppU, oppName);
    container.appendChild(card);
  }
}

function openNewMatchModal() {
  if (!currentUserDoc) { toast('Sign in to start matches'); return; }
  const friends = currentUserDoc.friends || [];
  const sel = document.getElementById('match-friend-select');
  sel.innerHTML = '<option value="">Loading…</option>';
  if (!friends.length) { toast('Add friends first'); return; }
  Promise.all(friends.map(uid => db.collection('users').doc(uid).get())).then(snaps => {
    sel.innerHTML = '<option value="">— Select a friend —</option>';
    snaps.forEach((snap,i) => { if (snap.exists) { const o = document.createElement('option'); o.value = friends[i]; o.textContent = snap.data().displayName; sel.appendChild(o); } });
  });
  document.getElementById('new-match-modal').classList.add('visible');
}
function openNewMatchModalWith(uid, name) {
  openNewMatchModal();
  setTimeout(() => { const trySet = () => { const sel = document.getElementById('match-friend-select'); const opt = [...sel.options].find(o=>o.value===uid); if (opt) opt.selected = true; else setTimeout(trySet,200); }; trySet(); }, 300);
}
function closeNewMatchModal() { document.getElementById('new-match-modal').classList.remove('visible'); }

async function createMatch() {
  const friendUid = document.getElementById('match-friend-select').value;
  const courseId  = document.getElementById('match-course-select').value;
  if (!friendUid) { toast('Select a friend first'); return; }
  const initScores = {};
  initScores[currentUser.uid] = Array(18).fill(null);
  initScores[friendUid]       = Array(18).fill(null);
  try {
    await db.collection('matches').add({ courseId, player1: currentUser.uid, player2: friendUid, scores: initScores, status: 'active', winner: null, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    closeNewMatchModal(); toast('Match created! ⛳'); navTo('matches');
  } catch(e) { toast('Could not create match — check Firestore rules'); }
}

async function openMatchGame(matchId, matchData, oppU, oppName) {
  activeMatchId = matchId; activeMatchData = matchData;
  activeMatchOpponentName = oppName; opponentUid = oppU;
  const course = COURSES.find(c=>c.id===matchData.courseId) || COURSES[0];
  const myScores = (matchData.scores && matchData.scores[currentUser.uid]) || Array(18).fill(null);
  let nextHole = myScores.findIndex(s => s === null);
  if (nextHole === -1) nextHole = 17;
  MG = {
    courseId: course.id, courseName: course.name,
    words: [...course.words], currentHole: nextHole,
    scores: myScores.map(s => s === null ? undefined : s),
    guesses: Array(18).fill(null).map(() => []),
    completed: myScores.every(s => s !== null)
  };
  updateMatchOppBar();
  showScreen('match-game-screen');
  startMatchHole();
}

function updateMatchOppBar() {
  if (!activeMatchData || !opponentUid) return;
  const oppS = (activeMatchData.scores && activeMatchData.scores[opponentUid]) || [];
  const oppVP = oppS.filter(s=>s!=null).reduce((a,s)=>a+scoreInfo(s).vspar, 0);
  const oppH  = oppS.filter(s=>s!=null).length;
  document.getElementById('match-opp-avatar').textContent = (activeMatchOpponentName||'?')[0].toUpperCase();
  document.getElementById('match-opp-name-sm').textContent = activeMatchOpponentName;
  document.getElementById('match-opp-score-sm').textContent = fmtVP(oppVP);
  document.getElementById('match-opp-holes-sm').textContent = ` ${oppH}/18 holes`;
}

async function saveMatchHoleScore(holeIdx, score) {
  if (!activeMatchId || !currentUser) return;
  const key = `scores.${currentUser.uid}.${holeIdx}`;
  const update = {}; update[key] = score;
  await db.collection('matches').doc(activeMatchId).update(update);
  const snap = await db.collection('matches').doc(activeMatchId).get();
  activeMatchData = snap.data();
  const myS  = activeMatchData.scores[currentUser.uid] || [];
  const oppS = activeMatchData.scores[opponentUid] || [];
  if (myS.every(s=>s!==null) && oppS.every(s=>s!==null)) {
    const myVP  = myS.reduce((a,s)=>a+scoreInfo(s).vspar, 0);
    const oppVP = oppS.reduce((a,s)=>a+scoreInfo(s).vspar, 0);
    const winner = myVP < oppVP ? currentUser.uid : myVP > oppVP ? opponentUid : 'tie';
    await db.collection('matches').doc(activeMatchId).update({ status: 'complete', winner });
    if (winner === currentUser.uid) spawnConfetti(60);
  }
}

function exitMatchGame() { showScreen('matches-screen'); activeMatchId=null; activeMatchData=null; MG=null; }

// ─── MATCH GAME LOOP ──────────────────────────────────────
let MG=null, MCG=[], mCurGuess='', mHoleActive=false, mHoleWord='', mKS={};

function startMatchHole() {
  if (!MG) return;
  mHoleWord  = MG.words[MG.currentHole].toUpperCase();
  MCG        = MG.guesses[MG.currentHole] ? [...MG.guesses[MG.currentHole]] : [];
  mCurGuess  = ''; mKS = {}; mHoleActive = true;
  MCG.forEach(g => updateMKS(g));
  document.getElementById('match-hole-number-display').textContent = `Hole ${MG.currentHole+1} of 18 · Par 4`;
  const vp = MG.scores.filter(s=>s!==undefined).reduce((a,s)=>a+scoreInfo(s).vspar, 0);
  document.getElementById('match-running-score-badge').textContent = fmtVP(vp);
  renderMatchGrid(); renderMatchKB();
  if (MG.scores[MG.currentHole] !== undefined) { mHoleActive = false; showMatchResult(MG.scores[MG.currentHole]); }
}

const KBROWS2=[['Q','W','E','R','T','Y','U','I','O','P'],['A','S','D','F','G','H','J','K','L'],['ENTER','Z','X','C','V','B','N','M','⌫']];

function renderMatchGrid() {
  const g = document.getElementById('match-game-grid'); g.innerHTML = '';
  for (let r=0; r<6; r++) {
    const re = document.createElement('div'); re.className='grid-row'; re.id=`mrow-${r}`;
    for (let c=0; c<5; c++) {
      const t = document.createElement('div'); t.className='tile'; t.id=`mtile-${r}-${c}`;
      if (r < MCG.length) { t.textContent=MCG[r][c]; t.setAttribute('data-state',evalMGuess(MCG[r])[c]); }
      else if (r===MCG.length && c<mCurGuess.length) { t.textContent=mCurGuess[c]; t.classList.add('filled'); }
      re.appendChild(t);
    }
    g.appendChild(re);
  }
}
function updateMatchRow() {
  const r = MCG.length;
  for (let c=0; c<5; c++) {
    const t = document.getElementById(`mtile-${r}-${c}`); if (!t) continue;
    if (c < mCurGuess.length) { t.textContent=mCurGuess[c]; t.classList.add('filled'); }
    else { t.textContent=''; t.classList.remove('filled'); }
  }
}
function evalMGuess(guess) {
  const res=Array(5).fill('absent'), wa=mHoleWord.split(''), ga=guess.split(''), used=Array(5).fill(false);
  for (let i=0; i<5; i++) if (ga[i]===wa[i]) { res[i]='correct'; used[i]=true; }
  for (let i=0; i<5; i++) { if (res[i]==='correct') continue; for (let j=0; j<5; j++) if (!used[j]&&ga[i]===wa[j]) { res[i]='present'; used[j]=true; break; } }
  return res;
}
function updateMKS(guess) {
  const res=evalMGuess(guess), p={correct:3,present:2,absent:1};
  guess.split('').forEach((l,i) => { if ((p[res[i]]||0)>(p[mKS[l]]||0)) mKS[l]=res[i]; });
}
function renderMatchKB() {
  const kb = document.getElementById('match-keyboard'); kb.innerHTML = '';
  KBROWS2.forEach(row => {
    const re = document.createElement('div'); re.className='kb-row';
    row.forEach(k => {
      const b = document.createElement('button'); b.className='key'+(k.length>1?' wide':''); b.textContent=k; b.dataset.key=k;
      if (mKS[k]) b.setAttribute('data-state', mKS[k]);
      b.addEventListener('click', () => handleMatchKey(k)); re.appendChild(b);
    });
    kb.appendChild(re);
  });
}
function updateMatchKB() { document.querySelectorAll('#match-keyboard .key').forEach(b => { if (mKS[b.dataset.key]) b.setAttribute('data-state',mKS[b.dataset.key]); }); }

function handleMatchKey(key) {
  if (!mHoleActive) return;
  if (document.getElementById('hole-result-overlay').classList.contains('visible')) return;
  if (document.getElementById('match-scorecard-panel').classList.contains('visible')) return;
  if (key==='⌫') { if (mCurGuess.length>0) { mCurGuess=mCurGuess.slice(0,-1); updateMatchRow(); } return; }
  if (key==='ENTER') { submitMatchGuess(); return; }
  if (/^[A-Z]$/.test(key) && mCurGuess.length<5) { mCurGuess+=key; updateMatchRow(); }
}
function submitMatchGuess() {
  if (mCurGuess.length!==5) { toast('Not enough letters'); shakeMatchRow(MCG.length); return; }
  if (!VALID.has(mCurGuess) && mCurGuess!==mHoleWord) { toast('Not a word'); shakeMatchRow(MCG.length); return; }
  const ri = MCG.length;
  MCG.push(mCurGuess); MG.guesses[MG.currentHole]=[...MCG];
  const res = evalMGuess(mCurGuess); updateMKS(mCurGuess);
  animMatchReveal(ri, mCurGuess, res, () => {
    updateMatchKB();
    const won=res.every(r=>r==='correct'), fail=MCG.length>=6&&!won;
    if (won||fail) {
      mHoleActive = false;
      const s = won ? MCG.length : 7;
      MG.scores[MG.currentHole] = s;
      saveMatchHoleScore(MG.currentHole, s);
      const vp = MG.scores.filter(x=>x!==undefined).reduce((a,x)=>a+scoreInfo(x).vspar, 0);
      document.getElementById('match-running-score-badge').textContent = fmtVP(vp);
      if (won && s<=3) spawnConfetti(s===1?120:s===2?80:40);
      setTimeout(() => showMatchResult(s), 600);
    } else { mCurGuess=''; updateMatchRow(); }
  });
  mCurGuess=''; updateMatchRow();
}
function animMatchReveal(row, guess, res, cb) {
  for (let c=0; c<5; c++) {
    const t = document.getElementById(`mtile-${row}-${c}`); if (!t) continue;
    setTimeout(() => {
      t.classList.add('flipping');
      setTimeout(() => {
        t.setAttribute('data-state', res[c]); t.classList.remove('flipping');
        if (c===4) {
          if (res.every(r=>r==='correct')) { for (let i=0;i<5;i++) setTimeout(()=>{const tt=document.getElementById(`mtile-${row}-${i}`);if(tt)tt.classList.add('bounce');},i*80); }
          if (cb) setTimeout(cb, 300);
        }
      }, 250);
    }, c*120);
  }
}
function shakeMatchRow(r) { for (let c=0;c<5;c++) { const t=document.getElementById(`mtile-${r}-${c}`); if(t){t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');} } }

function showMatchResult(s) {
  const info = scoreInfo(s);
  const ic = document.getElementById('result-icon');
  ic.textContent=info.icon; ic.style.animation='none'; void ic.offsetWidth; ic.style.animation='';
  document.getElementById('result-label').textContent = info.label;
  document.getElementById('result-label').style.color  = info.color;
  document.getElementById('result-score-text').textContent = s<=6 ? `${s} guess${s!==1?'es':''} · ${fmtVP(info.vspar)}` : 'Failed · +3';
  document.getElementById('result-word').textContent = mHoleWord;
  const allDone = MG.scores.filter(s=>s!==undefined).length >= 18;
  document.getElementById('result-next-btn').textContent = allDone ? '📋 View Scorecard' : 'Next Hole →';
  document.getElementById('result-next-btn').onclick = allDone ? showMatchFinalScorecard : nextMatchHole;
  document.getElementById('hole-result-overlay').classList.add('visible');
}
function nextMatchHole() {
  document.getElementById('hole-result-overlay').classList.remove('visible');
  const nextIdx = MG.scores.findIndex((s,i) => i > MG.currentHole && s === undefined);
  if (nextIdx === -1) { showMatchFinalScorecard(); return; }
  MG.currentHole = nextIdx; startMatchHole();
}
function showMatchFinalScorecard() { document.getElementById('hole-result-overlay').classList.remove('visible'); toggleMatchScorecard(); }

function toggleMatchScorecard() {
  const p = document.getElementById('match-scorecard-panel'), v=p.classList.contains('visible');
  if (!v) renderMatchSC();
  p.classList.toggle('visible', !v);
}
function renderMatchSC() {
  const el = document.getElementById('match-scorecard-content'); if (!el) return;
  const oppS = (activeMatchData?.scores?.[opponentUid]) || [];
  const myS  = MG.scores.map(s => s===undefined ? null : s);
  const makeT = (start, end) => {
    let h = `<table class="scorecard-table"><thead><tr><th>HOLE</th>`;
    for (let i=start;i<=end;i++) h+=`<th>${i}</th>`;
    h += `<th>TOT</th></tr><tr><th style="color:var(--gray-mid)">PAR</th>`;
    for (let i=start;i<=end;i++) h+=`<td style="color:var(--gray-mid);font-size:10px">4</td>`;
    h += `<td style="color:var(--gray-mid)">${(end-start+1)*4}</td></tr></thead><tbody>`;
    const renderRow = (scores, label, labelColor) => {
      let rt=0, row=`<tr><td style="color:${labelColor};font-size:10px;font-family:monospace">${label}</td>`;
      for (let i=start;i<=end;i++) {
        const sc=scores[i-1];
        if (sc==null) { row+=`<td class="score-cell-pending">—</td>`; continue; }
        const vp=scoreInfo(sc).vspar; rt+=vp;
        let cl='score-cell-par';
        if(vp<=-2)cl='score-cell-eagle';else if(vp===-1)cl='score-cell-birdie';
        else if(vp===1)cl='score-cell-bogey';else if(vp===2)cl='score-cell-double';else if(vp>=3)cl='score-cell-triple';
        row+=`<td class="${cl}">${sc===7?'X':sc}</td>`;
      }
      const sg=rt>0?'+':'';
      row+=`<td style="font-weight:700;color:${rt<0?'var(--gold)':rt>0?'#e06060':'var(--green-light)'}">${sg}${rt}</td></tr>`;
      return row;
    };
    h += renderRow(myS, 'You', 'var(--gold)');
    h += renderRow(oppS.map(s=>s===null?null:s), activeMatchOpponentName||'Opp', 'var(--gray-mid)');
    return h + '</tbody></table>';
  };
  const myVP  = myS.filter(s=>s!=null).reduce((a,s)=>a+scoreInfo(s).vspar, 0);
  const oppVP = oppS.filter(s=>s!=null).reduce((a,s)=>a+scoreInfo(s).vspar, 0);
  document.getElementById('match-sc-course-name').textContent = MG.courseName;
  let html = makeT(1,9) + makeT(10,18);
  html += `<div class="total-vs-par">You: <strong>${fmtVP(myVP)}</strong> &nbsp;·&nbsp; ${activeMatchOpponentName||'Opp'}: <strong>${fmtVP(oppVP)}</strong></div>`;
  if (activeMatchData?.status==='complete') {
    const w = activeMatchData.winner;
    html += `<div class="winner-banner" style="margin-top:12px"><div class="winner-title">${w===currentUser.uid?'🏆 You win!':(w==='tie'?'🤝 Tie game!':`💀 ${activeMatchOpponentName||'Opp'} wins`)}</div></div>`;
  }
  el.innerHTML = html;
}

// ─── OVERRIDE initHome to require auth ────────────────────
const _baseInitHome = initHome;
initHome = function() {
  if (!currentUser) {
    // Not signed in yet — auth state handler will call navTo('play') when ready
    return;
  }
  _baseInitHome();
};

// ─── KEYBOARD: route to match or solo ────────────────────
// The original keydown listener only fires for #game-screen.
// We add one for #match-game-screen.
document.addEventListener('keydown', e => {
  if (!document.getElementById('match-game-screen').classList.contains('active')) return;
  if (e.key==='Enter') handleMatchKey('ENTER');
  else if (e.key==='Backspace') handleMatchKey('⌫');
  else if (/^[a-zA-Z]$/.test(e.key)) handleMatchKey(e.key.toUpperCase());
});

</script>
